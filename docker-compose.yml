services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dayskew
      POSTGRES_PASSWORD: dayskew
      POSTGRES_DB: dayskew
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://dayskew:dayskew@postgres:5432/dayskew
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data: