name: Deploy Backend to tse-server

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, tse-server]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Test
        working-directory: repo/backend
        run: go test ./...

      - name: Build server + migrate (linux/amd64)
        working-directory: repo/backend
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o out/server  ./cmd/server
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o out/migrate ./cmd/migrate

      - name: Ship migrations (idempotent)
        working-directory: repo
        run: |
          cp -r backend/db /opt/dayskew/db

      - name: Stage binaries
        run: |
          cp repo/backend/out/server  /opt/dayskew/staging/server
          cp repo/backend/out/migrate /opt/dayskew/staging/migrate

      - name: Deploy (systemd + migrate + restart)
        run: sudo /opt/dayskew/deploy.sh

      - name: Health check
        run: |
          curl -sf http://localhost:8080/health && echo "HEALTH_OK"
          curl -sf http://localhost:8080/tasks && echo "TASKS_OK"